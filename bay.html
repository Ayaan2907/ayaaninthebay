<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ayaan in the bay — a map with notes</title>
<meta name="description" content="the bay area at real coordinates: startups, offices, housing, sports and tours as toggleable layers, each dot carrying a first-person note. click a dot, read why it matters.">

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@ayaaninthebay">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23faf9f6'/%3E%3Ctext x='7' y='23' font-family='monospace' font-size='18' fill='%23c2631a'%3E%E2%9D%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/bay/bay.css">
<script>
  // theme before paint (light default; respect a saved choice)
  try { var t = localStorage.getItem("theme"); if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
</script>
</head>
<body>
<!-- the bay : real geography, first-person notes. standalone surface. -->
<section class="map bay" id="bay">
  <div class="bar">
    <div class="t">✻ <b>bay</b> <span class="hint">drag · scroll · click a dot · <kbd>n</kbd> night</span></div>
    <div class="r"><button id="bayNight">n · night</button><a href="/" title="back to the terminal">← terminal</a></div>
  </div>
  <div class="stage">
    <div id="bayMap" aria-label="bay area map"></div>
    <div class="layers" id="bayLayers" hidden></div>
    <div class="hud" id="bayHud">loading tiles…</div>
    <div class="card" id="bayCard" hidden></div>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="/assets/bay/map.js"></script>
</body>
</html>
